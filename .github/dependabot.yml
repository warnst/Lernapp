version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    # Hauptversionen (z. B. ESLint 10, TypeScript 7) bewusst von Hand, siehe docs/ENTSCHEIDUNGEN.md
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
